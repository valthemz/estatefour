<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Estate No. 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080808; color: #e5e5e5; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .gold-text { color: #c5a059; }
        .gold-border { border-color: rgba(197, 160, 89, 0.2); }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(197, 160, 89, 0.1); }
        .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; font-weight: bold; }
        .status-pending { background: #f59e0b20; color: #f59e0b; }
        .status-ready { background: #10b98120; color: #10b981; }
        .step-hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Layar Login Admin -->
    <div id="login-screen" class="fixed inset-0 z-[200] bg-black flex items-center justify-center p-6 font-sans">
        <div class="glass-card p-10 rounded-2xl w-full max-w-sm text-center space-y-6 shadow-2xl">
            <h2 class="text-3xl font-serif gold-text italic">Admin Access</h2>
            <p class="text-xs opacity-50 uppercase tracking-widest">Masukkan PIN</p>
            <input type="password" id="admin-pin" placeholder="••••" class="text-center bg-neutral-900 border gold-border p-4 w-full rounded outline-none text-2xl tracking-[0.5em] text-white">
            <div id="login-error" class="text-red-500 text-[10px] uppercase font-bold hidden">PIN yang Anda masukkan salah.</div>
            <button id="login-btn" onclick="handleLogin()" class="w-full bg-[#c5a059] text-black font-bold py-4 rounded hover:bg-[#d4b47a] transition-all uppercase tracking-widest">Login</button>
        </div>
    </div>

    <!-- Konten Dashboard -->
    <div id="dashboard" class="step-hidden min-h-screen font-sans">
        <nav class="p-6 border-b gold-border flex justify-between items-center bg-black/50 sticky top-0 z-50 backdrop-blur-md">
            <div class="flex items-center space-x-2">
                <span class="text-xl font-serif gold-text italic tracking-tighter">Estate Admin Panel</span>
            </div>
            <div class="flex items-center space-x-6 text-xs uppercase opacity-60">
                <span id="sync-status" class="flex items-center">
                    <span id="sync-dot" class="w-2 h-2 bg-red-500 rounded-full mr-2"></span>
                    <span id="sync-text">Connecting...</span>
                </span>
                <button onclick="location.reload()" class="hover:text-white border border-white/20 px-3 py-1 rounded transition-colors font-bold">Logout</button>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto p-8 space-y-12">
            
            <!-- Antrean Pesanan Aktif -->
            <section class="space-y-6">
                <h3 class="text-2xl font-serif gold-text border-b gold-border pb-2 flex items-center">
                    <i data-lucide="list-ordered" class="mr-3 w-6 h-6"></i> Pesanan Masuk
                </h3>
                <div id="order-queue" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="col-span-full py-20 text-center opacity-30 italic font-serif">Menunggu data dari server...</div>
                </div>
            </section>

            <!-- Riwayat Penjualan -->
            <section class="space-y-6">
                <h3 class="text-2xl font-serif gold-text border-b gold-border pb-2 flex items-center opacity-50">
                    <i data-lucide="history" class="mr-3 w-6 h-6"></i> Riwayat Selesai
                </h3>
                <div class="overflow-x-auto glass-card rounded-2xl border gold-border shadow-lg">
                    <table class="w-full text-left text-sm">
                        <thead class="text-[10px] uppercase opacity-40 border-b border-white/5 bg-white/5 font-sans font-bold">
                            <tr>
                                <th class="p-4">ID Pesanan</th>
                                <th class="p-4">Customer</th>
                                <th class="p-4">Items</th>
                                <th class="p-4 text-right">Total</th>
                                <th class="p-4 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="history-list">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Feedback Message -->
    <div id="msg-box" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[300] bg-white text-black px-6 py-3 rounded-full text-xs font-bold uppercase tracking-widest shadow-2xl hidden">
        Status Updated.
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getFirestore, collection, onSnapshot, updateDoc, doc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        // --- KONFIGURASI SINKRON DENGAN ORDER.HTML ---
        const manualConfig = {
            apiKey: "AIzaSyBveDfd5C9MtfvXSyh0pz8do4-uPF-6zDg",
            authDomain: "estatefour-499fc.firebaseapp.com",
            projectId: "estatefour-499fc",
            storageBucket: "estatefour-499fc.firebasestorage.app",
            messagingSenderId: "393866853020",
            appId: "1:393866853020:web:45cd741f7542cca0de4b59",
            measurementId: "G-95MXBEJP85"
        };

        let db, auth, appId, user;

        // FUNGSI LOGIN PIN
        window.handleLogin = async () => {
            const pinInput = document.getElementById('admin-pin').value;
            const errorText = document.getElementById('login-error');
            
            if(pinInput === "1234") {
                errorText.classList.add('hidden');
                document.getElementById('login-screen').classList.add('step-hidden');
                document.getElementById('dashboard').classList.remove('step-hidden');
                await initAdminSystem();
            } else {
                errorText.classList.remove('hidden');
                document.getElementById('admin-pin').value = "";
            }
        };

        async function initAdminSystem() {
            const syncText = document.getElementById('sync-text');
            const syncDot = document.getElementById('sync-dot');

            try {
                // Mencoba mengambil config environment, jika tidak ada pakai manualConfig
                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
                const config = configStr ? JSON.parse(configStr) : manualConfig;
                appId = typeof __app_id !== 'undefined' ? __app_id : 'estate-no-4';
                
                const app = initializeApp(config);
                db = getFirestore(app);
                auth = getAuth(app);

                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                
                // Melakukan autentikasi terlebih dahulu (RULE 3)
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (u) => { 
                    user = u;
                    if (user) {
                        syncDot.classList.replace('bg-red-500', 'bg-emerald-500');
                        syncDot.classList.add('animate-pulse');
                        syncText.innerText = 'Live Update On';
                        startSync();
                    }
                });

            } catch (e) { 
                console.error("Firebase Error:", e);
                syncText.innerText = 'Connection Error';
            }
        }

        function startSync() {
            if (!user) return;

            // Jalur database orders (RULE 1)
            const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');

            // Pengolahan data real-time (RULE 2)
            onSnapshot(ordersRef, (snapshot) => {
                const queueContainer = document.getElementById('order-queue');
                const historyList = document.getElementById('history-list');
                
                queueContainer.innerHTML = '';
                historyList.innerHTML = '';

                const allOrders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                // Sort pesanan terbaru di atas
                allOrders.sort((a, b) => {
                    const tA = a.createdAt?.seconds || 0;
                    const tB = b.createdAt?.seconds || 0;
                    return tB - tA;
                });

                const activeOrders = allOrders.filter(o => o.status !== 'completed');
                const completedOrders = allOrders.filter(o => o.status === 'completed');

                if (activeOrders.length === 0) {
                    queueContainer.innerHTML = '<div class="col-span-full py-20 text-center opacity-30 italic font-serif">Tidak ada pesanan aktif.</div>';
                }

                activeOrders.forEach(order => {
                    const isReady = order.status === 'ready';
                    queueContainer.innerHTML += `
                        <div class="glass-card p-6 rounded-2xl border ${isReady ? 'border-emerald-500/40 bg-emerald-500/5' : 'gold-border'} space-y-4 shadow-xl">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h4 class="text-xl font-serif gold-text font-bold">${order.name || 'Anonymous'}</h4>
                                    <p class="text-[10px] uppercase opacity-40 tracking-widest mt-1">
                                        ID: ${order.orderId || 'NEW'} | HP: ${order.phone || '-'}
                                    </p>
                                    <p class="text-[9px] uppercase font-bold text-white/30 mt-1">${order.method || 'Order'} | ${order.payment || '-'}</p>
                                </div>
                                <span class="status-badge ${isReady ? 'status-ready' : 'status-pending'}">${order.status || 'pending'}</span>
                            </div>
                            
                            <div class="text-sm font-light italic opacity-70 border-l gold-border pl-4 py-1">
                                ${order.cart ? order.cart.map(i => `- ${i.name}`).join('<br>') : 'No items'}
                            </div>

                            ${order.method === 'preorder' ? `
                                <div class="bg-white/5 p-2 rounded text-[10px] font-mono italic opacity-60">
                                    Pickup: ${order.date || '-'} @ ${order.time || '-'}
                                </div>
                            ` : ''}

                            <div class="flex space-x-2 pt-2">
                                ${!isReady ? 
                                    `<button onclick="updateStatus('${order.id}', 'ready')" class="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-lg text-[10px] uppercase tracking-widest hover:bg-emerald-500 transition-all">Minuman Siap</button>` :
                                    `<button onclick="updateStatus('${order.id}', 'completed')" class="flex-1 bg-white text-black font-bold py-3 rounded-lg text-[10px] uppercase tracking-widest hover:bg-neutral-200 transition-all">Sudah Diambil</button>`
                                }
                            </div>
                        </div>`;
                });

                completedOrders.forEach(order => {
                    historyList.innerHTML += `
                        <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                            <td class="p-4 font-mono text-[10px] opacity-60">${order.orderId || '-'}</td>
                            <td class="p-4 font-bold text-xs">${order.name || '-'}</td>
                            <td class="p-4 italic text-xs font-serif">${order.cart ? order.cart.map(i => i.name).join(', ') : '-'}</td>
                            <td class="p-4 gold-text font-bold text-xs text-right">Rp ${order.cart ? order.cart.reduce((a, b) => a + (b.price || 0), 0).toLocaleString() : '0'}</td>
                            <td class="p-4 text-right">
                                <button onclick="deleteRecord('${order.id}')" class="text-red-500/30 hover:text-red-500 transition-colors p-2">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </td>
                        </tr>`;
                });
                lucide.createIcons();
            }, (error) => {
                console.error("Snapshot Error:", error);
                document.getElementById('sync-text').innerText = 'Sync Lost';
            });
        }

        window.updateStatus = async (docId, newStatus) => {
            if (!user) return;
            try {
                const orderRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', docId);
                await updateDoc(orderRef, { status: newStatus });
                showToast("Status Updated");
            } catch (e) { showToast("Error Updating Status"); }
        };

        window.deleteRecord = async (docId) => {
            if (!user) return;
            if (confirm("Hapus riwayat pesanan ini?")) {
                try {
                    const orderRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', docId);
                    await deleteDoc(orderRef);
                } catch (e) { console.error(e); }
            }
        };

        function showToast(msg) {
            const msgBox = document.getElementById('msg-box');
            msgBox.innerText = msg;
            msgBox.classList.remove('hidden');
            setTimeout(() => msgBox.classList.add('hidden'), 3000);
        }

        lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Estate No. 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080808; color: #e5e5e5; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .gold-text { color: #c5a059; }
        .gold-border { border-color: rgba(197, 160, 89, 0.2); }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(197, 160, 89, 0.1); }
        .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; font-weight: bold; }
        .status-pending { background: #f59e0b20; color: #f59e0b; }
        .status-ready { background: #10b98120; color: #10b981; }
        .step-hidden { display: none !important; }

        /* Gaya Nota/Resit Digital (Sama dengan order.html) */
        .receipt-admin {
            background: #fefefe;
            color: #333;
            padding: 25px;
            border-radius: 2px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-size: 12px;
            position: relative;
        }
        .receipt-admin::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(-45deg, transparent 5px, #fefefe 5px), linear-gradient(45deg, transparent 5px, #fefefe 5px);
            background-size: 10px 10px;
        }
    </style>
</head>
<body>

    <!-- Layar Login Admin -->
    <div id="login-screen" class="fixed inset-0 z-[200] bg-black flex items-center justify-center p-6 font-sans">
        <div class="glass-card p-10 rounded-2xl w-full max-w-sm text-center space-y-6 shadow-2xl">
            <h2 class="text-3xl font-serif gold-text italic text-center">Admin Access</h2>
            <p class="text-xs opacity-50 uppercase tracking-widest text-white">Masukkan PIN</p>
            <input type="password" id="admin-pin" placeholder="••••" class="text-center bg-neutral-900 border gold-border p-4 w-full rounded outline-none text-2xl tracking-[0.5em] text-white">
            <button id="login-btn" onclick="handleLogin()" class="w-full bg-[#c5a059] text-black font-bold py-4 rounded hover:bg-[#d4b47a] transition-all uppercase tracking-widest">Masuk</button>
        </div>
    </div>

    <!-- Konten Dashboard -->
    <div id="dashboard" class="step-hidden min-h-screen font-sans">
        <nav class="p-6 border-b gold-border flex justify-between items-center bg-black/50 sticky top-0 z-50 backdrop-blur-md">
            <span class="text-xl font-serif gold-text italic tracking-tighter">Estate No. 4 Admin</span>
            <div class="flex items-center space-x-6 text-[10px] uppercase opacity-60">
                <span id="sync-status" class="flex items-center">
                    <span id="sync-dot" class="w-2 h-2 bg-red-500 rounded-full mr-2"></span> 
                    <span id="sync-text">Menghubungkan...</span>
                </span>
                <button onclick="location.reload()" class="hover:text-white border border-white/20 px-3 py-1 rounded">Keluar</button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto p-8 space-y-12">
            <!-- Antrean Nota Pesanan -->
            <section class="space-y-6">
                <h3 class="text-2xl font-serif gold-text border-b gold-border pb-2 flex items-center font-light">
                    <i data-lucide="list-ordered" class="mr-3 w-6 h-6"></i> Nota Pesanan Masuk
                </h3>
                <div id="order-queue" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                    <div class="col-span-full py-20 text-center opacity-30 italic font-serif">Menunggu pesanan baru...</div>
                </div>
            </section>

            <!-- Riwayat Selesai -->
            <section class="space-y-6">
                <h3 class="text-2xl font-serif gold-text border-b gold-border pb-2 flex items-center opacity-50 font-light">
                    <i data-lucide="history" class="mr-3 w-6 h-6"></i> Riwayat Transaksi
                </h3>
                <div class="overflow-x-auto glass-card rounded-2xl border gold-border shadow-lg">
                    <table class="w-full text-left text-sm">
                        <thead class="text-[10px] uppercase opacity-40 border-b border-white/5 bg-white/5 font-bold">
                            <tr>
                                <th class="p-4">ID Pesanan</th>
                                <th class="p-4">Pelanggan</th>
                                <th class="p-4">Items</th>
                                <th class="p-4 text-right">Total</th>
                                <th class="p-4 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="history-list"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getFirestore, collection, onSnapshot, updateDoc, doc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        // KONFIGURASI SINKRON DENGAN ORDER.HTML
        const firebaseConfig = {
            apiKey: "AIzaSyBveDfd5C9MtfvXSyh0pz8do4-uPF-6zDg",
            authDomain: "estatefour-499fc.firebaseapp.com",
            projectId: "estatefour-499fc",
            storageBucket: "estatefour-499fc.firebasestorage.app",
            messagingSenderId: "393866853020",
            appId: "1:393866853020:web:45cd741f7542cca0de4b59",
            measurementId: "G-95MXBEJP85"
        };

        let db, auth, currentUser;
        const appIdStr = 'estatefour-499fc';

        window.handleLogin = () => {
            const pin = document.getElementById('admin-pin').value;
            if(pin === "1234") {
                document.getElementById('login-screen').classList.add('step-hidden');
                document.getElementById('dashboard').classList.remove('step-hidden');
                initConnection();
            } else {
                alert("PIN Salah!");
            }
        };

        async function initConnection() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        document.getElementById('sync-dot').className = "w-2 h-2 bg-emerald-500 rounded-full mr-2 animate-pulse";
                        document.getElementById('sync-text').innerText = "Live Update Aktif";
                        startListening();
                    }
                });
            } catch (e) {
                document.getElementById('sync-text').innerText = "Koneksi Gagal";
            }
        }

        function startListening() {
            const ordersRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'orders');
            
            onSnapshot(ordersRef, (snapshot) => {
                const queue = document.getElementById('order-queue');
                const history = document.getElementById('history-list');
                queue.innerHTML = ''; history.innerHTML = '';

                const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                // Sort terbaru di atas
                docs.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                const active = docs.filter(o => o.status !== 'completed');
                const done = docs.filter(o => o.status === 'completed');

                if (active.length === 0) {
                    queue.innerHTML = '<div class="col-span-full py-20 text-center opacity-30 italic">Belum ada nota pesanan...</div>';
                }

                active.forEach(order => {
                    const isReady = order.status === 'ready';
                    queue.innerHTML += `
                        <div class="space-y-4 animate-in fade-in">
                            <div class="receipt-admin text-gray-800 font-sans">
                                <div class="text-center border-b border-dashed border-gray-300 pb-3 mb-4 font-serif">
                                    <h4 class="font-bold uppercase tracking-widest text-base">Estate No. 4 Nota</h4>
                                    <div class="text-[8px] font-mono mt-1 opacity-50 uppercase">ID: ${order.orderId || 'BARU'}</div>
                                </div>
                                <div class="space-y-1.5 mb-4 text-[11px]">
                                    <div class="flex justify-between font-bold"><span>Pelanggan:</span> <span class="uppercase">${order.name}</span></div>
                                    <div class="flex justify-between"><span>Metode:</span> <span class="uppercase">${order.method || 'Takeaway'}</span></div>
                                    <div class="flex justify-between"><span>Pembayaran:</span> <span class="text-emerald-700 font-bold uppercase">${order.payment}</span></div>
                                    <div class="flex justify-between"><span>Nomor HP:</span> <span>${order.phone || '-'}</span></div>
                                </div>
                                <div class="border-y border-dashed border-gray-300 py-3 space-y-2 mb-4">
                                    ${order.cart.map(i => `
                                        <div class="flex justify-between italic text-[11px]">
                                            <span>${i.name} (x1)</span> 
                                            <span>Rp ${i.price.toLocaleString()}</span>
                                        </div>`).join('')}
                                </div>
                                <div class="flex justify-between font-bold text-sm">
                                    <span>TOTAL:</span> 
                                    <span>Rp ${order.cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</span>
                                </div>
                            </div>
                            <div class="flex space-x-2">
                                ${!isReady ? 
                                    `<button onclick="updateStatus('${order.id}', 'ready')" class="flex-1 bg-emerald-600 text-white font-bold py-3 rounded text-[10px] uppercase tracking-widest shadow-lg">Minuman Siap</button>` :
                                    `<button onclick="updateStatus('${order.id}', 'completed')" class="flex-1 bg-white text-black font-bold py-3 rounded text-[10px] uppercase tracking-widest shadow-lg border">Sudah Diambil</button>`
                                }
                                <button onclick="deleteRecord('${order.id}')" class="px-4 border border-red-500/30 text-red-500 rounded hover:bg-red-500/10 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>`;
                });

                done.forEach(order => {
                    history.innerHTML += `
                        <tr class="border-b border-white/5 hover:bg-white/5 transition-colors font-sans">
                            <td class="p-4 font-mono text-[10px] opacity-60 uppercase">${order.orderId || '-'}</td>
                            <td class="p-4 font-bold text-xs">${order.name}</td>
                            <td class="p-4 italic text-xs font-serif font-light text-white/60">${order.cart?.map(i => i.name).join(', ')}</td>
                            <td class="p-4 gold-text font-bold text-xs text-right">Rp ${order.cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</td>
                            <td class="p-4 text-right">
                                <button onclick="deleteRecord('${order.id}')" class="text-red-500/30 hover:text-red-500 transition-colors p-2">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </td>
                        </tr>`;
                });
                lucide.createIcons();
            });
        }

        window.updateStatus = async (id, status) => {
            try {
                await updateDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', 'orders', id), { status });
            } catch (e) { console.error(e); }
        };

        window.deleteRecord = async (id) => {
            if(confirm("Hapus catatan pesanan ini secara permanen?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', 'orders', id));
                } catch (e) { console.error(e); }
            }
        };

        lucide.createIcons();
    </script>
</body>
</html>
